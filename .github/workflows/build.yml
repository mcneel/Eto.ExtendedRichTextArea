name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # the macos workload isn't available on Windows
            solution: Eto.ExtendedRichTextArea.Windows.slnf
          - os: macos-26
            solution: Eto.ExtendedRichTextArea.slnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload restore Eto.ExtendedRichTextArea.slnx

      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore
        run: dotnet restore ${{ matrix.solution }} -p:UseLocalEto=False

      - name: Build
        run: dotnet build ${{ matrix.solution }} --configuration Release --no-restore -p:UseLocalEto=False

      - name: Test
        run: dotnet test test/Eto.ExtendedRichTextArea.UnitTest/Eto.ExtendedRichTextArea.UnitTest.csproj --configuration Release --no-build -p:UseLocalEto=False
